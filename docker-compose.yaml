version: '3.7'

services:
  builder:
    image: maven:3.6.3-jdk-8
    volumes:
      - artifacts:/app/target
    working_dir: /app
    command: >
      sh -c "
      git clone https://github.com/boxfuse/boxfuse-sample-java-war-hello.git &&
      cd boxfuse-sample-java-war-hello &&
      mvn clean package -Dmaven.compiler.source=1.8 &&
      cp target/hello-1.0.war /app/target/ROOT.war
      "
  prod:
    image: tomcat:10.1-jre17-temurin-alpine
    ports:
      - "8080:8080"
    volumes:
      - artifacts:/usr/local/tomcat/webapps
    depends_on:
      - builder
    restart: always

volumes:
  artifacts: